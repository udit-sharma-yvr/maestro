[project]
name = "maestro"
version = "0.1.0"
description = "Self-hosted agentic assistant — MCP tools, streaming reasoning, live observability."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langgraph>=0.2.60",
    "langchain>=0.3.7",
    "langchain-core>=0.3.15",
    "langchain-anthropic>=0.2.4",
    "langchain-openai>=0.2.8",
    "langchain-aws>=0.2.7",
    "langchain-mcp-adapters>=0.1.0",
    "mcp>=1.6",
    "pydantic-settings>=2.6",
]

[project.scripts]
maestro = "maestro.__main__:main"
maestro-mcp-fs = "mcp_tools.filesystem:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maestro", "mcp_tools"]
